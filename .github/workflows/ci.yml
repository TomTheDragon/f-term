name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # GUI and compact-console code (winit loads X11/Wayland at run time, so
      # no system packages are needed to build it).
      - run: cargo clippy --all-targets --features gui,narrow-console -- -D warnings
      - run: cargo test --features gui,narrow-console

  # Make sure the code still builds with Rust 1.77 (needed for Windows 7 builds).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.77.2
      - run: cargo check --no-default-features --features tls-rustcrypto,images

  release-builds:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/setup-tools.sh
      - run: >-
          scripts/build-all.sh linux-x86_64 linux-i586 macos-arm64 macos-x86_64 windows-x86_64 windows-i686
          linux-x86_64-gui linux-i586-gui windows-x86_64-gui windows-i686-gui
      - uses: actions/upload-artifact@v4
        with:
          name: f-term-binaries
          path: dist/
